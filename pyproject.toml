[project]
name = "aria-atmos"
version = "0.16.2"
description = "ARIA — Atmospheric Regional Integration and Analysis"
requires-python = ">=3.11"
dependencies = [
  "dask[array]>=2025.1",
  "distributed>=2025.1",
  "pyyaml>=6.0",
  "icechunk>=1.0",
  "act-atmos>=2.0",
  "xarray>=2024.1",
  "pandas>=2.0",
  "numpy>=1.26",
  "requests>=2.31",
  "scipy>=1.11",
  "pyarrow>=15",
  "zarr>=2.17",
  "fsspec>=2024.2",
  "matplotlib>=3.8",
  "cartopy>=0.25",
  "pillow>=10",
  "plotly>=6",
  "streamlit>=1.40",
  "arm_pyart>=2.1",
  "streamlit-autorefresh>=1.0.1",
  "herbie-data>=2026.3.0",
  "cfgrib>=0.9.15",
  "eccodes>=2.35"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
aria = "aria.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["aria*"]
exclude = ["recipes*", "docs*", "examples*", "tests*"]
